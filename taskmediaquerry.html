<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background:linear-gradient(180deg,rgb(0, 242, 255),rgb(236, 142, 145)60%);
            height: 700px;
            
        }
        .bg
        { display: grid;
            grid-template-columns: repeat(3,350px);
            justify-content: center;
            gap: 25px;
            
            
            
            
            
            
            
        }
        h1{
            text-align: center;
            margin-bottom:90px ;
            
        }
        img{
            height: 250px;
            width:250px;
            padding: 5px;
            border-top-left-radius: 30px;
            border-bottom-right-radius: 30px; 
            
            
        }
        .flowers{
            height: 350px;
            width: 280px;
             border-top-left-radius: 30px;
            border-bottom-right-radius: 30px;
            text-align: center;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            box-shadow: 3px 3px 4px 3px ;
            background-color: rgba(146, 255, 255, 0.979);
            
        
            
        
        }
        button{
            margin: 10px;
            background-color:rgb(3, 248, 207);
            border-radius: 30px;
            border: none;
            height: 30px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        @media(max-width:900px){
           .bg {
    
            grid-template-columns:repeat(2,350px);
            
            }
        }
           @media(max-width:400px){
           .bg {
    
            grid-template-columns:repeat(1,350px);
            
            }
        }
    </style>
</head>
<body>
    <h1>You can buy flowers from here......</h1>
    <div class="bg">
        <div class="flowers"><img src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT71E7Jkq4EHry27fCQx2Z0DnVm__aEty4bNMMw6wIc0A&s=10" alt="">FLOWER BOUQUET <br><button>Add to cart</button></div>
        <div class="flowers"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzEg8icfPnQWtm1D7jsUIjaymHq36WfvWoSGg4FBLOwA&s=10" alt="">FLOWER BOUQUET <br><button>Add to cart</button></div>
        <div class="flowers"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMqEoMaQ27kvulbBzYTqdbWsNI0hzDOIHJ6bfJAIfr0Q&s=10" alt="">FLOWER BOUQUET <br><button>Add to cart</button></div>
    
    </div>
    
</body>
</html>
